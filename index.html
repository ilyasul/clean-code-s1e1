<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    >
    <link
    rel="stylesheet"
    href="style.css"
    media="screen"
    >
    <meta charset="utf-8">
  </head>
  <body class="body">
    <main class="main wrapper">
      <article class="about">
        <img class="about__image" src="./eisenhower-matrix.jpg" alt="eisenhower matrix">
        <a
        class="about__link"
        href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
        </a>
      </article>
      <section class="task-add">
        <h3>Add Item</h3>
        <div class="task-add__form">
          <input id="new-task" class="task" type="text">
          <button>Add</button>
        </div>
      </section>
      <section class="task-list">
        <h3>Todo</h3>
        <ul class="list" id="incomplete-tasks">
          <li class="item">
            <input type="checkbox">
            <label class="item__name">Pay Bills</label>
            <input type="text" class="task">
            <button class="item__edit">Edit</button>
            <button class="item__delete">
              <img src="./remove.svg" alt="">
            </button>
          </li>
          <li class="item edit-mode">
            <input type="checkbox">
            <label class="item__name">Go Shopping</label>
            <input type="text" value="go-shopping" class="task">
            <button class="item__edit">Save</button>
            <button class="item__delete">
              <img src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
      <section class="task-done">
        <h3>Completed</h3>
        <ul class="list" id="completed-tasks">
          <li class="item">
            <input type="checkbox" checked>
            <label class="item__name">See the Doctor</label>
            <input type="text" class="task">
            <button class="item__edit">Edit</button>
            <button class="item__delete">
              <img src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
